<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <title>Zero Point 2.0 - Tactical FPS Framework</title>
  <defs>
    <!-- Dark Tactical Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C11" />
      <stop offset="50%" stop-color="#0D131C" />
      <stop offset="100%" stop-color="#070A0F" />
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <!-- Tactical Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#182333" stroke-width="0.8" opacity="0.6" />
      <circle cx="40" cy="0" r="1.5" fill="#FF9500" opacity="0.3" />
    </pattern>

    <!-- Subtle Scanlines -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="12" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="12" fill="url(#grid)" />
  <rect width="1200" height="420" rx="12" fill="url(#scanlines)" />

  <!-- Outer Tactical Border Frame -->
  <rect x="18" y="18" width="1164" height="384" rx="8" fill="none" stroke="#223044" stroke-width="1.5" />
  
  <!-- Corner Chamfer Brackets (Call of Duty HUD Style) -->
  <!-- Top Left -->
  <path d="M 14 44 L 14 14 L 44 14" fill="none" stroke="#FF9500" stroke-width="3" />
  <rect x="22" y="22" width="4" height="4" fill="#FF9500" />
  <!-- Top Right -->
  <path d="M 1156 14 L 1186 14 L 1186 44" fill="none" stroke="#FF9500" stroke-width="3" />
  <rect x="1174" y="22" width="4" height="4" fill="#FF9500" />
  <!-- Bottom Left -->
  <path d="M 14 376 L 14 406 L 44 406" fill="none" stroke="#FF9500" stroke-width="3" />
  <rect x="22" y="394" width="4" height="4" fill="#FF9500" />
  <!-- Bottom Right -->
  <path d="M 1156 406 L 1186 406 L 1186 376" fill="none" stroke="#FF9500" stroke-width="3" />
  <rect x="1174" y="394" width="4" height="4" fill="#FF9500" />

  <!-- Top Header Telemetry Strip -->
  <g transform="translate(48, 48)">
    <!-- Classified Badge -->
    <rect x="0" y="0" width="190" height="24" rx="4" fill="#FF9500" fill-opacity="0.12" stroke="#FF9500" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#FF9500" />
    <text x="24" y="16" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#FF9500" letter-spacing="1.5">TASK FORCE // ZERO-POINT</text>

    <!-- Operational Meta -->
    <text x="210" y="16" font-family="'Consolas', 'Courier New', monospace" font-size="11" fill="#6B7D96" letter-spacing="1">LAT: 34.0522° N // LON: 118.2437° W // ELEV: 142M</text>
    <text x="960" y="16" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#00D2FF" letter-spacing="1.5">SYS.STAT: OPTIMAL [144 FPS]</text>
  </g>

  <!-- Horizontal Dividing Rule -->
  <line x1="48" y1="84" x2="1152" y2="84" stroke="#223044" stroke-width="1" />
  <line x1="48" y1="84" x2="240" y2="84" stroke="#FF9500" stroke-width="2" />

  <!-- Main Hero Content: Left Side (Title + Details) -->
  <g transform="translate(56, 120)">
    <!-- Callout Subheader -->
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="16" height="3" fill="#FF9500" />
      <text x="26" y="8" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="700" fill="#FF9500" letter-spacing="3">TACTICAL FPS COMBAT SUITE</text>
    </g>

    <!-- Main Project Title -->
    <text x="0" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="4">ZERO POINT <tspan fill="#FF9500">2.0</tspan></text>

    <!-- Tagline -->
    <text x="2" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#A4B3C6" letter-spacing="0.5">Next-Gen First-Person Shooter Framework Powered by Unity 6 &amp; Universal RP</text>

    <!-- Core Badges / Pill Tags -->
    <g transform="translate(2, 156)">
      <!-- Badge 1: Unity 6 URP -->
      <rect x="0" y="0" width="138" height="30" rx="4" fill="#141C28" stroke="#2C3D55" stroke-width="1" />
      <text x="14" y="19" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#00D2FF">UNITY 6 // URP</text>

      <!-- Badge 2: Dynamic Weapon Menu -->
      <rect x="148" y="0" width="186" height="30" rx="4" fill="#141C28" stroke="#2C3D55" stroke-width="1" />
      <text x="162" y="19" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#FF9500">[P] LOADOUT SELECTOR</text>

      <!-- Badge 3: Modular AR Platform -->
      <rect x="344" y="0" width="176" height="30" rx="4" fill="#141C28" stroke="#2C3D55" stroke-width="1" />
      <text x="358" y="19" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#E2E8F0">MODULAR AR ARSENAL</text>

      <!-- Badge 4: Procedural ADS -->
      <rect x="530" y="0" width="168" height="30" rx="4" fill="#141C28" stroke="#2C3D55" stroke-width="1" />
      <text x="544" y="19" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#38EF7D">PROCEDURAL RECOIL</text>
    </g>
  </g>

  <!-- Right Side: Tactical Target Reticle & HUD Telemetry Display -->
  <g transform="translate(860, 110)">
    <!-- HUD Panel Container -->
    <rect x="0" y="0" width="280" height="230" rx="6" fill="#0E141E" fill-opacity="0.8" stroke="#233246" stroke-width="1" />
    
    <!-- Chamfer Accent on Panel -->
    <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="#FF9500" stroke-width="2" />
    <path d="M 260 230 L 280 230 L 280 210" fill="none" stroke="#FF9500" stroke-width="2" />

    <!-- Radar / Target Reticle -->
    <g transform="translate(140, 95)">
      <!-- Concentric Radar Rings -->
      <circle cx="0" cy="0" r="65" fill="none" stroke="#243347" stroke-width="1" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="45" fill="none" stroke="#2E4059" stroke-width="1.2" />
      <circle cx="0" cy="0" r="22" fill="none" stroke="#FF9500" stroke-width="1.5" opacity="0.8" />
      <circle cx="0" cy="0" r="3" fill="#FF9500" />

      <!-- Reticle Crosshairs -->
      <line x1="-75" y1="0" x2="-25" y2="0" stroke="#FF9500" stroke-width="1.2" />
      <line x1="25" y1="0" x2="75" y2="0" stroke="#FF9500" stroke-width="1.2" />
      <line x1="0" y1="-75" x2="0" y2="-25" stroke="#FF9500" stroke-width="1.2" />
      <line x1="0" y1="25" x2="0" y2="75" stroke="#FF9500" stroke-width="1.2" />

      <!-- Angle Markings -->
      <text x="-65" y="-50" font-family="'Consolas', monospace" font-size="9" fill="#00D2FF">TRK//04</text>
      <text x="35" y="55" font-family="'Consolas', monospace" font-size="9" fill="#6B7D96">FOV:90°</text>
    </g>

    <!-- Telemetry Data Readout -->
    <g transform="translate(18, 175)">
      <line x1="0" y1="0" x2="244" y2="0" stroke="#1F2C3E" stroke-width="1" />
      <text x="0" y="18" font-family="'Consolas', monospace" font-size="10" fill="#718298">PRIMARY RIG :</text>
      <text x="120" y="18" font-family="'Consolas', monospace" font-size="10" font-weight="700" fill="#FFFFFF">AR-01 / CAL 5.56</text>
      
      <text x="0" y="36" font-family="'Consolas', monospace" font-size="10" fill="#718298">FIRE CONTROL :</text>
      <text x="120" y="36" font-family="'Consolas', monospace" font-size="10" font-weight="700" fill="#38EF7D">SEMI / FULL AUTO</text>
    </g>
  </g>

  <!-- Bottom Footer Status Strip -->
  <g transform="translate(48, 368)">
    <line x1="0" y1="0" x2="1104" y2="0" stroke="#1C2736" stroke-width="1" />
    <circle cx="8" cy="14" r="4" fill="#38EF7D" />
    <text x="20" y="18" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#E2E8F0">READY FOR SIMULATION</text>
    <text x="240" y="18" font-family="'Consolas', monospace" font-size="11" fill="#5F7188">// ZERO POINT TACTICAL COMBAT ENGINE VER 2.0.4</text>
    <text x="940" y="18" font-family="'Consolas', monospace" font-size="11" fill="#FF9500">PRESS [P] FOR LOADOUT</text>
  </g>
</svg>
